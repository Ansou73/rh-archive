# ── Serveur ─────────────────────────────────────────
server.port=8080

# ── Base de données MySQL (XAMPP) ───────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/rh_archive?useSSL=false&serverTimezone=Africa/Dakar&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Ansou@2024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Fichiers (upload) ────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/documents

# ── JWT ──────────────────────────────────────────────
app.jwt.secret=rhArchiveSecretKey2024!ChangeInProduction#XyZ123
app.jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── OpenAPI / Swagger ────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logs ─────────────────────────────────────────────
logging.level.com.rharchive=DEBUG
logging.level.org.springframework.security=INFO